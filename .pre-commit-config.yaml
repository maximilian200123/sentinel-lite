# Local guardrails (R-01, R-02). Hook repos are pinned to commit SHAs, like CI actions.
# Installed by `make setup`, which points git at .githooks/ so the cache stays in this folder.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: check-yaml
      - id: check-json
