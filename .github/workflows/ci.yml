name: ci

# Untrusted PR code runs only under `pull_request`, which gets a read-only token
# and no secrets for fork PRs. `pull_request_target` is never used here.
on:
  pull_request:
  push:
    branches: [main]

# Default for every job: read the code, nothing else. A job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make setup
      - run: make test

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # zizmor flags unpinned actions, excessive permissions and dangerous triggers.
      - run: pip install zizmor==1.32.0
      - run: zizmor --offline --min-severity low .github/workflows
